<div class="space-y-6 p-6">
    <app-page-header>
        <ng-container title>Knowledge Base</ng-container>
        <ng-container subtitle>Curated resources to help you land your next role</ng-container>
    </app-page-header>

    <div class="flex gap-6 flex-col md:flex-row">
        <!-- Category Sidebar -->
        <div class="flex md:flex-col gap-2 md:w-48 flex-shrink-0 overflow-x-auto md:overflow-visible pb-1 md:pb-0">
            @for (cat of categories; track cat.id) {
            <button (click)="activeCategory.set(cat.id)"
                class="flex items-center gap-2.5 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors whitespace-nowrap w-full text-left"
                [ngClass]="activeCategory() === cat.id
                    ? 'bg-indigo-600 text-white'
                    : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'">
                <span class="material-icons text-[18px]">{{ cat.icon }}</span>
                {{ cat.label }}
            </button>
            }
        </div>

        <!-- Resource Cards -->
        <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-4 content-start">
            @for (resource of activeResources; track resource.url) {
            <a [href]="resource.url" target="_blank" rel="noopener noreferrer"
                class="group bg-slate-800 border border-slate-700 rounded-xl p-5 hover:border-indigo-500/50 hover:shadow-lg hover:shadow-indigo-500/5 transition-all flex flex-col gap-3">
                <div class="flex items-start justify-between gap-2">
                    <h4 class="text-slate-100 font-semibold group-hover:text-indigo-400 transition-colors leading-snug">
                        {{ resource.title }}
                    </h4>
                    <span class="material-icons text-slate-600 group-hover:text-indigo-400 transition-colors text-[18px] flex-shrink-0 mt-0.5">
                        open_in_new
                    </span>
                </div>
                <p class="text-slate-400 text-sm leading-relaxed flex-1">{{ resource.description }}</p>
                <span class="self-start text-xs font-medium px-2 py-0.5 rounded-full bg-slate-700 text-slate-400">
                    {{ resource.tag }}
                </span>
            </a>
            }
        </div>
    </div>
</div>
