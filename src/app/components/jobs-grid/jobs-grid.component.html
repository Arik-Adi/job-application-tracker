<div class="h-full flex flex-col space-y-4">
    <app-page-header>
        <ng-container title>{{ 'SIDEBAR.JOBS' | translate }}</ng-container>
        <ng-container actions>
            <app-button>+ New Application</app-button>
        </ng-container>
    </app-page-header>

    <div
        class="flex-1 w-full bg-slate-900/50 rounded-xl overflow-hidden border border-slate-700 shadow-xl flex flex-col">
        <!-- Search Bar -->
        <div class="p-4 bg-slate-800/50 border-b border-slate-700">
            <input type="text" [placeholder]="'Simple Search...' | translate"
                class="w-full md:w-1/3 bg-slate-900 text-white placeholder-slate-500 border border-slate-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                (input)="onFilterTextBoxChanged($event)">
        </div>

        <!-- Grid -->
        <ag-grid-angular class="ag-theme-quartz-dark w-full h-full" [rowData]="store.jobs()" [columnDefs]="colDefs"
            [defaultColDef]="defaultColDef" [pagination]="true" [paginationPageSize]="20" [rowHeight]="rowHeight"
            [quickFilterText]="quickFilterText" [suppressCellFocus]="true">
        </ag-grid-angular>
    </div>
</div>
