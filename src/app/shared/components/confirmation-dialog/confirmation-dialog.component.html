<div
    class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-[400px] max-w-[90vw] overflow-hidden flex flex-col p-6 space-y-4">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full flex items-center justify-center bg-red-500/10 text-red-500">
            <span class="material-icons">delete_forever</span>
        </div>
        <h3 class="text-lg font-semibold text-slate-100">{{ data.title }}</h3>
    </div>

    <p class="text-slate-400 text-sm leading-relaxed">
        {{ data.message }}
    </p>

    <div class="flex justify-end gap-3 pt-2">
        <button (click)="close()"
            class="p-2 text-slate-400 hover:text-slate-200 transition-colors rounded-lg hover:bg-slate-800/50"
            title="Cancel">
            <span class="material-icons">close</span>
        </button>
        <button (click)="confirm()"
            class="p-2 text-red-500 hover:text-red-400 transition-colors rounded-lg hover:bg-red-500/10"
            title="Confirm">
            <span class="material-icons">check</span>
        </button>
    </div>
</div>
